<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lune Analytics — V1.4</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Lune Pulse — v1.5</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--sh:#fafbfc;--bd:#e8eaed;--bl:#f0f1f3;--t1:#1a1d23;--t2:#5f6775;--t3:#8b93a1;--ac:#10b981;--al:#d1fae5;--ad:#059669;--blue:#3b82f6;--bluel:#dbeafe;--orange:#f59e0b;--orangel:#fef3c7;--purple:#8b5cf6;--purplel:#ede9fe;--red:#ef4444;--redl:#fee2e2;--pink:#ec4899;--r:10px;--rs:6px;--rl:14px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 4px 12px rgba(0,0,0,.08);--f:'DM Sans',-apple-system,sans-serif;--m:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--t1);padding:24px 0;position:fixed;height:100vh;z-index:100;overflow-y:auto}
.sidebar-logo{padding:0 20px 28px;font-size:18px;font-weight:700;color:#fff;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.sidebar-logo span{color:var(--ac)}
.snav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#8b93a1;font-size:13.5px;font-weight:500;text-decoration:none;transition:all .15s;cursor:pointer}
.snav a:hover{color:#c8ccd4;background:rgba(255,255,255,.04)}
.snav a.active{color:#fff;background:rgba(255,255,255,.08);border-right:2px solid var(--ac)}
.snav a svg{width:18px;height:18px;opacity:.7;flex-shrink:0}
.ssec{font-size:10px;font-weight:600;color:#5f6775;letter-spacing:1px;text-transform:uppercase;padding:20px 20px 8px}
.main{margin-left:220px;flex:1}
.bc{padding:12px 32px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--t3)}
.bc a{color:var(--ac);text-decoration:none;cursor:pointer;font-weight:500}.bc a:hover{text-decoration:underline}
.bc .sep{color:var(--bd)}
.ph{padding:20px 32px 16px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.ph h1{font-size:20px;font-weight:700;letter-spacing:-.3px}.ph p{font-size:13px;color:var(--t3);margin-top:2px}
.ct{padding:24px 32px}
.fbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subpills{padding:8px 32px 12px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spill{font-size:11px;padding:4px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--t2);cursor:pointer;font-weight:500;transition:all .15s;white-space:nowrap}
.spill:hover{border-color:var(--ac);color:var(--ac)}
.spill.active{background:var(--ac);color:white;border-color:var(--ac)}
.fl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--f)}
.chip:hover{border-color:var(--ac);background:var(--al)}
.cl{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s}
.cl:has(input:checked){background:var(--al);border-color:var(--ac);color:var(--ad)}
.fi{padding:7px 12px;border:1px solid var(--bd);border-radius:var(--rs);font-size:12.5px;font-family:var(--f);background:var(--sf);color:var(--t1);outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--ac)}.fi.sm{width:100px}.fi.md{width:160px}.fi.lg{width:240px}
select.fi{cursor:pointer}
.rs2{font-size:12px;color:var(--t3)}
.btn{padding:8px 16px;border-radius:var(--rs);font-size:12.5px;font-weight:600;font-family:var(--f);cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ad)}
.btn-g{background:transparent;border:1px solid var(--bd);color:var(--t2)}.btn-g:hover{background:var(--bg)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:#2563eb}
.btn-sm{padding:5px 10px;font-size:11.5px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.bg2{background:var(--al);color:var(--ad)}.bb2{background:var(--bluel);color:var(--blue)}.bo2{background:var(--orangel);color:#b45309}.br2{background:var(--redl);color:var(--red)}
.vtabs{display:flex;gap:2px;background:var(--bg);border-radius:var(--rs);padding:2px}
.vtab{padding:5px 14px;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;color:var(--t3);transition:all .15s;border:none;background:none;font-family:var(--f)}
.vtab.active{background:var(--sf);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kr{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.kp{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px}
.kl{font-size:12px;font-weight:500;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.kv{font-size:26px;font-weight:700;letter-spacing:-.5px;font-family:var(--m)}
.kv small{font-size:14px;font-weight:500;color:var(--t2);font-family:var(--f);margin-left:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:14px}
.card-t{font-size:14px;font-weight:600;margin-bottom:2px}.card-s{font-size:12px;color:var(--t3);margin-bottom:16px}
.chb{position:relative;height:260px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.tc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.th2{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
.tht{font-size:14px;font-weight:600}.tha{font-size:12px;color:var(--ac);cursor:pointer;font-weight:500}.tha:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse}
thead th{font-size:10.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:8px 16px;text-align:left;border-bottom:1px solid var(--bd);background:var(--bg);white-space:nowrap;cursor:pointer}
thead th:not(:first-child){text-align:right}
tbody tr{cursor:pointer;transition:background .1s}tbody tr:hover{background:var(--sh)}
tbody td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--bl)}
tbody td:not(:first-child){text-align:right;font-family:var(--m);font-size:12px}
.bc2{display:flex;align-items:center;gap:10px}
.bi{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.bn{font-weight:500}
.sb{display:inline-flex;align-items:center;gap:6px}.sf2{height:6px;border-radius:3px;background:var(--ac);min-width:4px}.st2{font-size:11px;color:var(--t3)}
.hint{position:absolute;bottom:8px;right:8px;font-size:10px;color:var(--t3);background:var(--bg);padding:2px 8px;border-radius:10px;pointer-events:none}
.ds{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.dst{background:var(--bg);border-radius:var(--rs);padding:14px}.dsl{font-size:11px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.dsv{font-size:20px;font-weight:700;font-family:var(--m)}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;display:flex;gap:14px;cursor:pointer;transition:all .15s}
.pc:hover{border-color:var(--ac);box-shadow:var(--shadow)}
.pci{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pcn{font-size:13px;font-weight:600}.pcd{font-size:11.5px;color:var(--t3);margin-top:2px;line-height:1.4}
.pct{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ptag{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:var(--bg);color:var(--t2)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:none;align-items:center;justify-content:center}
.mo.open{display:flex}
.ml{background:var(--sf);border-radius:var(--rl);padding:24px;max-width:540px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.ml.wide{max-width:860px}
.page{display:none}.page.active{display:block}
.ef{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 0}
/* Phone preview */
.phone{width:280px;min-width:280px;height:540px;background:#000;border-radius:36px;padding:12px;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.phone-screen{width:100%;height:100%;background:#f8f9fa;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone-status{height:44px;background:linear-gradient(135deg,#065f46,#10b981);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#fff;font-size:10px;font-weight:600}
.phone-notch{width:120px;height:28px;background:#000;border-radius:0 0 16px 16px;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2}
.phone-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.phone-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.phone-nudge{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #a7f3d0;border-radius:14px;padding:14px;position:relative;animation:nudgeSlide .4s ease-out}
@keyframes nudgeSlide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.phone-btn{background:var(--ad);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:11px;font-weight:700;width:100%;text-align:center;cursor:default}
.phone-nav{height:52px;background:#fff;border-top:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.phone-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8px;color:#9ca3af}
.phone-nav-item.active{color:var(--ad)}
.nudge-input{width:100%;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font-size:13px;font-family:var(--f);resize:vertical;outline:none;transition:border-color .2s}
.nudge-input:focus{border-color:var(--ac)}
@media(max-width:1200px){.kr{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}}

/* ════════════════════════════════════════════════════════════════
   PULSE  —  Bank portal styles embedded in analytics v1.4
════════════════════════════════════════════════════════════════ */
.p-g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.p-sc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px}
.p-scl{font-size:11px;color:var(--t3);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.p-scv{font-size:22px;font-weight:700;letter-spacing:-.4px;font-family:var(--m)}
.p-scs{font-size:11px;color:var(--t3);margin-top:4px}
.p-sup{color:var(--ac);font-weight:600}
.p-ch{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.p-ch h3{font-size:13px;font-weight:600}
.p-mb16{margin-bottom:16px}.p-mb20{margin-bottom:20px}
/* Offer cards */
.mkt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ocard{background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .18s;position:relative}
.ocard:hover{border-color:var(--ac);box-shadow:0 4px 20px rgba(16,185,129,.12);transform:translateY(-1px)}
.ocard.is-new{border-color:#93c5fd}
.ocard-top{padding:16px 16px 14px}
.ocard-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bic{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.bname{font-size:13px;font-weight:600}.bcat{font-size:11px;color:var(--t3);margin-top:2px}
.match-hero{background:var(--t1);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.match-hero-v{font-size:22px;font-weight:700;color:var(--ac);letter-spacing:-.03em}
.match-hero-l{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.match-conf{font-size:11px;font-weight:500;padding:3px 8px;border-radius:4px}
.conf-hi{background:var(--al);color:var(--ad)}.conf-md{background:var(--orangel);color:#92400e}
.ocard-financials{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ocf{background:var(--bg);border-radius:6px;padding:9px 10px}
.ocf-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.ocf-v{font-size:14px;font-weight:700;letter-spacing:-.02em}
.ocard-bottom{padding:10px 16px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.new-flag{position:absolute;top:10px;right:10px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.3px}
/* Filter bar */
.p-fbar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.fpill{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--bd);background:var(--sf);color:var(--t2);transition:all .15s;font-family:var(--f)}
.fpill:hover{border-color:var(--ac);color:var(--ac)}.fpill.active{background:var(--t1);color:#fff;border-color:var(--t1)}
/* Campaign rows */
.camp-row{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--bd);transition:background .1s;cursor:pointer}
.camp-row:hover{background:var(--bg)}.camp-row:last-child{border-bottom:none}
.camp-brand-ico{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.camp-meta{flex:1;min-width:0}
.camp-title{font-size:13px;font-weight:600}.camp-sub{font-size:11px;color:var(--t3);margin-top:2px}
.p-prog{height:5px;background:var(--bl);border-radius:3px;overflow:hidden;margin-top:7px}
.p-pf{height:100%;background:var(--ac);border-radius:3px}
/* Campaign detail */
.cd-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.cd-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.cd-kp{background:var(--bg);border-radius:var(--rs);padding:12px 14px}
.cd-kl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.cd-kv{font-size:18px;font-weight:700;letter-spacing:-.03em;font-family:var(--m)}
.cd-ks{font-size:11px;color:var(--t3);margin-top:2px}
.wk-row{display:grid;grid-template-columns:100px 1fr 80px;align-items:center;gap:10px;padding:5px 0}
/* Pulse hero banner */
.pulse-hero{background:linear-gradient(135deg,#0c1821 0%,#0a2218 100%);border-radius:var(--r);padding:28px 32px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.pulse-hero h2{font-size:22px;font-weight:700;color:#fff;letter-spacing:-.4px;margin-bottom:6px}
.pulse-hero p{font-size:13px;color:rgba(255,255,255,.4);line-height:1.6;max-width:480px}
.pulse-hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,.15);color:var(--ac);font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;margin-top:10px}
.pulse-hero-stats{display:flex;gap:32px;flex-shrink:0}
.phs{text-align:center}.phsv{font-size:28px;font-weight:700;color:#fff;letter-spacing:-.5px;font-family:var(--m)}.phsl{font-size:11px;color:rgba(255,255,255,.35);margin-top:3px}
/* Cat rows */
.p-cat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.p-cat-row:last-child{border:none}
.p-cat-name{font-size:12px;font-weight:500;flex:1}
.p-cat-bar{flex:2;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.p-cat-bf{height:100%;background:var(--ac);border-radius:3px}
.p-cat-val{font-size:11px;font-weight:600;color:var(--t2);width:60px;text-align:right}
/* KV table */
.p-kv-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12px}
.p-kv-row:last-child{border-bottom:none}
.p-kv-k{color:var(--t3)}.p-kv-v{font-weight:600}


/* ── Pulse Activation Modal ── */
.act-steps{display:flex;align-items:center;gap:0;margin-bottom:28px}
.act-step{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--t3)}
.act-step.done .act-sn{background:var(--ac);border-color:var(--ac);color:#fff}
.act-step.cur .act-sn{background:var(--t1);border-color:var(--t1);color:#fff}
.act-step.cur{color:var(--t1)}
.act-sn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .2s}
.act-line{flex:1;height:1px;background:var(--bd);margin:0 8px;min-width:20px}
.act-line.done{background:var(--ac)}
.act-panel{display:none}.act-panel.active{display:block}
.offer-summary-card{background:var(--t1);border-radius:var(--r);padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.osc-ico{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.osc-name{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.2px}
.osc-meta{font-size:12px;color:rgba(255,255,255,.4);margin-top:3px}
.osc-stats{margin-left:auto;display:flex;gap:24px;flex-shrink:0}
.osc-stat{text-align:center}
.osc-stat-v{font-size:20px;font-weight:700;color:var(--ac);font-family:var(--m);letter-spacing:-.3px}
.osc-stat-l{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
.cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.cond-card{background:var(--bg);border:1.5px solid var(--bd);border-radius:var(--rs);padding:14px 16px;cursor:pointer;transition:all .15s}
.cond-card:hover{border-color:var(--ac)}
.cond-card.selected{border-color:var(--ac);background:var(--al)}
.cond-card-l{font-size:11px;color:var(--t3);margin-bottom:4px;font-weight:500}
.cond-card-v{font-size:14px;font-weight:700}
.cond-card.selected .cond-card-l{color:var(--ad)}
.seg-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.seg-pill{padding:5px 12px;border-radius:12px;font-size:11px;font-weight:500;border:1.5px solid var(--bd);background:var(--sf);color:var(--t2);cursor:pointer;transition:all .15s}
.seg-pill:hover{border-color:var(--ac);color:var(--ac)}
.seg-pill.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.confirm-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px}
.confirm-row:last-child{border:none}
.confirm-k{color:var(--t3);font-size:12px}.confirm-v{font-weight:600}
.confirm-banner{background:var(--al);border:1px solid var(--ac);border-radius:var(--rs);padding:14px 16px;display:flex;gap:10px;margin-bottom:20px}
.confirm-banner svg{flex-shrink:0;color:var(--ad);margin-top:1px}
.confirm-banner p{font-size:12px;color:var(--ad);line-height:1.6}
.success-state{text-align:center;padding:16px 0 8px}

function actGoStep(n) {
  _actStep = n;
  document.getElementById('modal-c').innerHTML = renderActivateModal(_activatingOffer, n);
}

function toggleActCard(cardId) {
  if (!_actSegState.cards) _actSegState.cards = [];
  const idx = _actSegState.cards.indexOf(cardId);
  if (idx >= 0) _actSegState.cards.splice(idx, 1);
  else _actSegState.cards.push(cardId);
  actGoStep(2);
}

function toggleScheme(scheme) {
  if (!_actSegState.cards) _actSegState.cards = [];
  const VISA_IDS = ['voyager-elite','voyager-world','share-infinite','share-signature','share-platinum','darna-infinite','darna-signature','darna-select','etihad-elevate','etihad-inspire','skywards-inf','skywards-sig','dnata-world'];
  const MC_IDS = ['marriott-elite','marriott-world'];
  const ids = scheme === 'Visa' ? VISA_IDS : MC_IDS;
  const allOn = ids.every(id => _actSegState.cards.includes(id));
  if (allOn) {
    _actSegState.cards = _actSegState.cards.filter(id => !ids.includes(id));
  } else {
    ids.forEach(id => { if (!_actSegState.cards.includes(id)) _actSegState.cards.push(id); });
  }
  actGoStep(2);
}

function toggleActSeg(seg, el) {
  if (!_actSegState.segs) _actSegState.segs = ['All eligible customers'];
  const idx = _actSegState.segs.indexOf(seg);
  if (seg === 'All eligible customers') {
    _actSegState.segs = ['All eligible customers'];
  } else {
    const allIdx = _actSegState.segs.indexOf('All eligible customers');
    if (allIdx >= 0) _actSegState.segs.splice(allIdx, 1);
    if (idx >= 0) _actSegState.segs.splice(idx, 1);
    else _actSegState.segs.push(seg);
    if (_actSegState.segs.length === 0) _actSegState.segs = ['All eligible customers'];
  }
  document.getElementById('modal-c').innerHTML = renderActivateModal(_activatingOffer, 2);
}

// ── Merchant: accordion helpers ──────────────────────────────────────────────
function mToggleCat(key) {
  const subs = document.getElementById('mcatsubs-' + key);
  const chev = document.getElementById('mcatchev-' + key);
  const hdr  = document.getElementById('mcathdr-' + key);
  const open = subs.style.display === 'block';
  // close all
  M_CATS.forEach(c => {
    const s = document.getElementById('mcatsubs-' + c.key);
    const cv = document.getElementById('mcatchev-' + c.key);
    const h = document.getElementById('mcathdr-' + c.key);
    if (s) s.style.display = 'none';
    if (cv) cv.style.transform = '';
    if (h) h.style.background = '';
  });
  if (!open) {
    subs.style.display = 'block';
    if (chev) chev.style.transform = 'rotate(90deg)';
    if (hdr) hdr.style.background = 'var(--bg)';
  }
}

function mToggleSub(key, sub, el) {
  const set = mSelSubs[key];
  const chkEl = el.querySelector('[id^="msubchk"]');
  if (set.has(sub)) {
    set.delete(sub);
    el.style.background = '';
    if (chkEl) { chkEl.style.background = ''; chkEl.style.borderColor = 'var(--bd)'; chkEl.innerHTML = ''; }
  } else {
    set.add(sub);
    el.style.background = 'var(--sf)';
    if (chkEl) { chkEl.style.background = 'var(--ac)'; chkEl.style.borderColor = 'var(--ac)'; chkEl.innerHTML = '<svg width="9" height="9" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  }
  const cnt = set.size;
  const cntEl = document.getElementById('mcatcnt-' + key);
  if (cntEl) { cntEl.textContent = cnt; cntEl.style.display = cnt > 0 ? 'inline-block' : 'none'; }
  mRenderStrip();
}

function mRemoveSub(key, sub) {
  mSelSubs[key].delete(sub);
  const safeId = sub.replace(/[^a-z0-9]/gi, '_');
  const rowEl = document.getElementById('msubrow-' + key + '-' + safeId);
  const chkEl = document.getElementById('msubchk-' + key + '-' + safeId);
  if (rowEl) rowEl.style.background = '';
  if (chkEl) { chkEl.style.background = ''; chkEl.style.borderColor = 'var(--bd)'; chkEl.innerHTML = ''; }
  const cnt = mSelSubs[key].size;
  const cntEl = document.getElementById('mcatcnt-' + key);
  if (cntEl) { cntEl.textContent = cnt; cntEl.style.display = cnt > 0 ? 'inline-block' : 'none'; }
  mRenderStrip();
}

function mRenderStrip() {
  const wrap = document.getElementById('m-and-strip');
  const tags = document.getElementById('m-and-tags');
  if (!wrap || !tags) return;
  const items = [];
  M_CATS.forEach(c => {
    if (mSelSubs[c.key].size) {
      items.push({type:'cat', label: c.label});
      [...mSelSubs[c.key]].forEach(s => items.push({type:'sub', key: c.key, label: s}));
    }
  });
  if (!items.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  let html = '';
  items.forEach((t, i) => {
    if (i > 0) html += '<span style="font-size:9.5px;font-weight:800;letter-spacing:.5px;color:rgba(255,255,255,.2);padding:0 2px;text-transform:uppercase">AND</span>';
    if (t.type === 'cat') {
      html += `<span style="display:inline-flex;align-items:center;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:500;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)">${t.label}</span>`;
    } else {
      html += `<span style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(0,196,140,.2);color:var(--ac)">${t.label}<button onclick="mRemoveSub('${t.key}','${t.label.replace(/'/g,"\\'")}')" style="cursor:pointer;opacity:.5;font-size:13px;line-height:1;background:none;border:none;color:inherit;padding:0;margin-left:1px">×</button></span>`;
    }
  });
  tags.innerHTML = html;
}

function mUpdFees() {
  const b = parseInt(document.getElementById('m-budget')?.value) || 0;
  const l = Math.round(b * .05), bk = Math.round(b * .05), n = b - l - bk;
  const fmt = v => 'AED ' + v.toLocaleString();
  const s = id => document.getElementById(id);
  if (s('m-fee-total')) s('m-fee-total').textContent = fmt(b);
  if (s('m-fee-lune'))  s('m-fee-lune').textContent  = '− ' + fmt(l);
  if (s('m-fee-bank'))  s('m-fee-bank').textContent  = '− ' + fmt(bk);
  if (s('m-fee-net'))   s('m-fee-net').textContent   = fmt(n);
}

  const rows = adminCampFilter === 'all' ? ADMIN_CAMPAIGNS_DATA : ADMIN_CAMPAIGNS_DATA.filter(c => c.status === adminCampFilter);

    const burnBar = c.status === 'live'
      ? `<div style="display:flex;align-items:center;gap:7px"><div style="width:64px;height:5px;background:var(--bl);border-radius:3px;overflow:hidden"><div style="width:${c.burnPct}%;height:100%;background:var(--ac);border-radius:3px"></div></div><span style="font-size:11.5px;font-weight:600">${c.burnPct}%</span></div>`

      : '<span style="font-size:11px;color:var(--t3)">—</span>';

go = function(pg, d) {
  const pulsePages = {
    'pulse':                         pgPulse,
    'pulse-offers':                  pgPulseOffers,
    'pulse-campaigns':               pgPulseCampaigns,
    'pulse-campaign-detail':         () => pgPulseCampaignDetail(d),
    'pulse-merchant':                pgPulseMerchant,
    'pulse-merchant-offers':         pgPulseMerchantOffers,
    'pulse-merchant-create':         pgPulseMerchantCreate,
    'pulse-merchant-live-detail':    () => pgPulseMerchantLiveDetail(d),
    'pulse-merchant-detail':         () => pgPulseMerchantDetail(d),
    'pulse-admin':                   pgPulseAdmin,
    'pulse-admin-review':            pgPulseAdminReview,
    'pulse-admin-campaigns':         pgPulseAdminCampaigns,
    'pulse-admin-campaign-detail':   () => pgPulseAdminCampaignDetail(d),
    'pulse-admin-published':         pgPulseAdminPublished,
  };
  if (pulsePages[pg]) {
    document.querySelectorAll('#snav a[data-p]').forEach(a => a.classList.toggle('active', a.dataset.p === pg));
    window.scrollTo(0, 0);
    Object.values(charts).forEach(c => { if (c && c.destroy) c.destroy(); });
    charts = {};
    document.getElementById('main-area').innerHTML = pulsePages[pg]();
  }
};

go('pulse-merchant');


// Version switcher
(async()=>{
  const sel=document.getElementById('vswitch');if(!sel)return;
  const thisFile=location.pathname.split('/').pop()||'analytics-v1_5.html';
  try{
    const r=await fetch('versions.json?t='+Date.now());
    const versions=await r.json();
    if(versions.length<=1){sel.style.display='none';return}
    sel.innerHTML=versions.map(v=>`<option value="${v.file}"${v.file===thisFile?' selected':''}>${v.version}</option>`).join('');
  }catch(e){sel.style.display='none'}
})();
</script>
