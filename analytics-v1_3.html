<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--sh:#fafbfc;--bd:#e8eaed;--bl:#f0f1f3;--t1:#1a1d23;--t2:#5f6775;--t3:#8b93a1;--ac:#10b981;--al:#d1fae5;--ad:#059669;--blue:#3b82f6;--bluel:#dbeafe;--orange:#f59e0b;--orangel:#fef3c7;--purple:#8b5cf6;--purplel:#ede9fe;--red:#ef4444;--redl:#fee2e2;--pink:#ec4899;--r:10px;--rs:6px;--rl:14px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 4px 12px rgba(0,0,0,.08);--f:'DM Sans',-apple-system,sans-serif;--m:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--t1);padding:24px 0;position:fixed;height:100vh;z-index:100;overflow-y:auto}
.sidebar-logo{padding:0 20px 28px;font-size:18px;font-weight:700;color:#fff;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.sidebar-logo span{color:var(--ac)}
.snav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#8b93a1;font-size:13.5px;font-weight:500;text-decoration:none;transition:all .15s;cursor:pointer}
.snav a:hover{color:#c8ccd4;background:rgba(255,255,255,.04)}
.snav a.active{color:#fff;background:rgba(255,255,255,.08);border-right:2px solid var(--ac)}
.snav a svg{width:18px;height:18px;opacity:.7;flex-shrink:0}
.ssec{font-size:10px;font-weight:600;color:#5f6775;letter-spacing:1px;text-transform:uppercase;padding:20px 20px 8px}
.main{margin-left:220px;flex:1}
.bc{padding:12px 32px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--t3)}
.bc a{color:var(--ac);text-decoration:none;cursor:pointer;font-weight:500}.bc a:hover{text-decoration:underline}
.bc .sep{color:var(--bd)}
.ph{padding:20px 32px 16px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.ph h1{font-size:20px;font-weight:700;letter-spacing:-.3px}.ph p{font-size:13px;color:var(--t3);margin-top:2px}
.ct{padding:24px 32px}
.fbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subpills{padding:8px 32px 12px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spill{font-size:11px;padding:4px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--t2);cursor:pointer;font-weight:500;transition:all .15s;white-space:nowrap}
.spill:hover{border-color:var(--ac);color:var(--ac)}
.spill.active{background:var(--ac);color:white;border-color:var(--ac)}
.fl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--f)}
.chip:hover{border-color:var(--ac);background:var(--al)}
.cl{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s}
.cl:has(input:checked){background:var(--al);border-color:var(--ac);color:var(--ad)}
.fi{padding:7px 12px;border:1px solid var(--bd);border-radius:var(--rs);font-size:12.5px;font-family:var(--f);background:var(--sf);color:var(--t1);outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--ac)}.fi.sm{width:100px}.fi.md{width:160px}.fi.lg{width:240px}
select.fi{cursor:pointer}
.rs2{font-size:12px;color:var(--t3)}
.btn{padding:8px 16px;border-radius:var(--rs);font-size:12.5px;font-weight:600;font-family:var(--f);cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ad)}
.btn-g{background:transparent;border:1px solid var(--bd);color:var(--t2)}.btn-g:hover{background:var(--bg)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:#2563eb}
.btn-sm{padding:5px 10px;font-size:11.5px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.bg2{background:var(--al);color:var(--ad)}.bb2{background:var(--bluel);color:var(--blue)}.bo2{background:var(--orangel);color:#b45309}.br2{background:var(--redl);color:var(--red)}
.vtabs{display:flex;gap:2px;background:var(--bg);border-radius:var(--rs);padding:2px}
.vtab{padding:5px 14px;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;color:var(--t3);transition:all .15s;border:none;background:none;font-family:var(--f)}
.vtab.active{background:var(--sf);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kr{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.kp{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px}
.kl{font-size:12px;font-weight:500;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.kv{font-size:26px;font-weight:700;letter-spacing:-.5px;font-family:var(--m)}
.kv small{font-size:14px;font-weight:500;color:var(--t2);font-family:var(--f);margin-left:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:14px}
.card-t{font-size:14px;font-weight:600;margin-bottom:2px}.card-s{font-size:12px;color:var(--t3);margin-bottom:16px}
.chb{position:relative;height:260px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.tc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.th2{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
.tht{font-size:14px;font-weight:600}.tha{font-size:12px;color:var(--ac);cursor:pointer;font-weight:500}.tha:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse}
thead th{font-size:10.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:8px 16px;text-align:left;border-bottom:1px solid var(--bd);background:var(--bg);white-space:nowrap;cursor:pointer}
thead th:not(:first-child){text-align:right}
tbody tr{cursor:pointer;transition:background .1s}tbody tr:hover{background:var(--sh)}
tbody td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--bl)}
tbody td:not(:first-child){text-align:right;font-family:var(--m);font-size:12px}
.bc2{display:flex;align-items:center;gap:10px}
.bi{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.bn{font-weight:500}
.sb{display:inline-flex;align-items:center;gap:6px}.sf2{height:6px;border-radius:3px;background:var(--ac);min-width:4px}.st2{font-size:11px;color:var(--t3)}
.hint{position:absolute;bottom:8px;right:8px;font-size:10px;color:var(--t3);background:var(--bg);padding:2px 8px;border-radius:10px;pointer-events:none}
.ds{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.dst{background:var(--bg);border-radius:var(--rs);padding:14px}.dsl{font-size:11px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.dsv{font-size:20px;font-weight:700;font-family:var(--m)}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;display:flex;gap:14px;cursor:pointer;transition:all .15s}
.pc:hover{border-color:var(--ac);box-shadow:var(--shadow)}
.pci{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pcn{font-size:13px;font-weight:600}.pcd{font-size:11.5px;color:var(--t3);margin-top:2px;line-height:1.4}
.pct{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ptag{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:var(--bg);color:var(--t2)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:none;align-items:center;justify-content:center}
.mo.open{display:flex}
.ml{background:var(--sf);border-radius:var(--rl);padding:24px;max-width:540px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.ml.wide{max-width:860px}
.page{display:none}.page.active{display:block}
.ef{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 0}
/* Phone preview */
.phone{width:280px;min-width:280px;height:540px;background:#000;border-radius:36px;padding:12px;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.phone-screen{width:100%;height:100%;background:#f8f9fa;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone-status{height:44px;background:linear-gradient(135deg,#065f46,#10b981);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#fff;font-size:10px;font-weight:600}
.phone-notch{width:120px;height:28px;background:#000;border-radius:0 0 16px 16px;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2}
.phone-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.phone-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.phone-nudge{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #a7f3d0;border-radius:14px;padding:14px;position:relative;animation:nudgeSlide .4s ease-out}
@keyframes nudgeSlide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.phone-btn{background:var(--ad);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:11px;font-weight:700;width:100%;text-align:center;cursor:default}
.phone-nav{height:52px;background:#fff;border-top:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.phone-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8px;color:#9ca3af}
.phone-nav-item.active{color:var(--ad)}
.nudge-input{width:100%;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font-size:13px;font-family:var(--f);resize:vertical;outline:none;transition:border-color .2s}
.nudge-input:focus{border-color:var(--ac)}
@media(max-width:1200px){.kr{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}}
</style>
</head>

let charts={};
function go(pg,d){
  document.querySelectorAll('#snav a[data-p]').forEach(a=>a.classList.toggle('active',a.dataset.p===pg));
  window.scrollTo(0,0);
  Object.values(charts).forEach(c=>{if(c&&c.destroy)c.destroy()});
  charts={};
  const pages={overview:pgOverview,brands:pgBrands,'brand-detail':pgBrandDetail,categories:pgCats,'cat-detail':pgCatDetail,month:pgMonth,subs:pgSubs,products:pgProducts,insights:pgInsights,builder:pgBuilder};
  if(pages[pg])document.getElementById('main-area').innerHTML=pages[pg](d);
  setTimeout(()=>initPage(pg,d),30);
}

// ===== OVERVIEW DATA HELPERS =====
let ovBrandCatFilter = '';

function setOvCatFilter(cat, el){
  ovBrandCatFilter = cat;
  document.querySelectorAll('#ovCatFilter .spill').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  filterOvBrands();
}

function filterOvBrands(){
  const q = (document.getElementById('ovBrandSearch')?.value||'').toLowerCase();
  const tbody = document.getElementById('ovBrandTbody');
  if(!tbody) return;
  let list = [...brands]
    .filter(b=>(!ovBrandCatFilter||b.cat===ovBrandCatFilter)&&(!q||b.n.toLowerCase().includes(q)))
    .sort((a,b)=>b.s-a.s)
    .slice(0,40);
  tbody.innerHTML = list.map(b=>{
    const idx=brands.indexOf(b);
    const pct=(b.s/totS*100);
    return `<tr onclick="go('brand-detail',${idx})" style="cursor:pointer;transition:background .1s" onmouseenter="this.style.background='var(--bg)'" onmouseleave="this.style.background=''">
      <td style="padding:9px 12px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;border-radius:6px;background:${b.cl};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0">${b.n[0]}</div>
          <div><div style="font-size:12.5px;font-weight:600;color:var(--t1)">${b.n}</div><div style="font-size:10.5px;color:var(--t3)">${b.cat}</div></div>
        </div>
      </td>
      <td style="padding:9px 12px;text-align:right;font-family:var(--m);font-size:12px;font-weight:600;color:var(--t1)">${fmtN(b.s)}</td>
      <td style="padding:9px 12px;text-align:right;font-family:var(--m);font-size:11px;color:var(--t2)">${fmtN(b.t)}</td>
      <td style="padding:9px 12px;text-align:right;font-family:var(--m);font-size:11px;color:var(--t2)">${fmtN(b.c)}</td>
      <td style="padding:9px 12px;min-width:90px">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="flex:1;height:4px;background:var(--bd);border-radius:2px;overflow:hidden"><div style="width:${Math.min(100,pct*4)}%;height:100%;background:${b.cl};border-radius:2px"></div></div>
          <span style="font-size:10.5px;color:var(--t3);font-family:var(--m);white-space:nowrap">${pct.toFixed(1)}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function filterOvCats(){
  const q = (document.getElementById('ovCatSearch')?.value||'').toLowerCase();

function togglePill(el,containerId){
  const box=document.getElementById(containerId);if(!box)return;
  const isAll=el.textContent==='All';
  if(isAll){
    box.querySelectorAll('.spill').forEach(p=>p.classList.remove('active'));
    el.classList.add('active');
  } else {
    box.querySelector('.spill.active')?.textContent==='All'&&box.querySelector('.spill.active')?.classList.remove('active');
    el.classList.toggle('active');
    const anyActive=box.querySelectorAll('.spill.active');
    if(anyActive.length===0){box.querySelectorAll('.spill').forEach((p,i)=>{if(i===0)p.classList.add('active')})}
  }
  // Trigger filter refresh
  if(containerId==='bxSubPills')filterBrands();
  else if(containerId==='cxSubPills')filterCats();
  else if(containerId==='ibSubPills'&&typeof calcIB==='function')calcIB();
}

  return pills.map(p=>p.textContent);

function buildSpendChart(){
  const ctx=document.getElementById('ch1');if(!ctx)return;
  if(charts.c1)charts.c1.destroy();

  // Seed-based pseudo-random so values are stable per bar index
  function seededRand(seed){let x=Math.sin(seed+1)*10000;return x-Math.floor(x);}

  let labels=[],barMonths=[],barCount=0;
  const now=new Date(2025,11,31);
  const avgDaily=169100000/365;

  if(ovGran==='daily'){
    const days=ovPeriod*30;
    for(let i=days-1;i>=0;i--){
      const d=new Date(now);d.setDate(d.getDate()-i);
      labels.push(d.getDate()+' '+MO[d.getMonth()]);
      barMonths.push(d.getMonth());
    }
  } else if(ovGran==='weekly'){
    const weeks=Math.ceil(ovPeriod*4.3);
    for(let i=weeks-1;i>=0;i--){
      const d=new Date(now);d.setDate(d.getDate()-(i*7));
      const ws=new Date(d);ws.setDate(ws.getDate()-6);
      labels.push(ws.getDate()+' '+MO[ws.getMonth()]+' – '+d.getDate()+' '+MO[d.getMonth()]);
      barMonths.push(d.getMonth());
    }
  } else {
    const startIdx=12-ovPeriod;
    labels=MO.slice(startIdx);
    for(let i=startIdx;i<12;i++)barMonths.push(i);
  }
  barCount=labels.length;

  // Build per-bar totals first (same logic as before, seeded)
  const barTotals=labels.map((l,bi)=>{
    if(ovGran==='daily'){
      const d=new Date(now);d.setDate(d.getDate()-(barCount-1-bi));
      const dow=d.getDay();
      const wf=dow===0||dow===5?0.75:dow===6?0.65:1;
      return Math.floor(avgDaily*wf*(0.7+seededRand(bi)*0.6));
    } else if(ovGran==='weekly'){
      return Math.floor(avgDaily*7*(0.8+seededRand(bi)*0.4));
    } else {
      return moSpend[barMonths[bi]]*1000000;
    }
  });

  const grandTotal=barTotals.reduce((a,b)=>a+b,0);
  const totalEl=document.getElementById('ch1total');
  if(totalEl)totalEl.textContent=(grandTotal/1000000).toFixed(1)+'M AED';
  const periodLabel=ovPeriod===1?'1 month':ovPeriod===3?'3 months':ovPeriod===6?'6 months':'12 months';
  const sub=document.getElementById('ch1sub');
  if(sub)sub.textContent=`${ovGran.charAt(0).toUpperCase()+ovGran.slice(1)} · Last ${periodLabel} · hover to see category split`;

  // Build one dataset per category — each value = that cat's share of the bar total
  // Category shares are seeded per (catIdx, barIdx) so they're stable
  const datasets=cats.map((cat,ci)=>{
    const shareBase=cat.s/catTot; // overall share
    const data=barTotals.map((bt,bi)=>{
      // slight per-bar variation ±15% around overall share, seeded
      const variation=0.85+seededRand(ci*1000+bi)*0.3;
      return Math.floor(bt*shareBase*variation);
    });
    return {
      label:cat.n,
      data,
      backgroundColor:cat.cl,
      hoverBackgroundColor:cat.cl+'dd',
      borderWidth:0,
      borderRadius:ci===cats.length-1?{topLeft:3,topRight:3}:0,
      stack:'spend'
    };
  });

  const maxTicks=ovGran==='daily'&&barCount>60?15:ovGran==='weekly'&&barCount>20?10:undefined;

  charts.c1=new Chart(ctx,{
    type:'bar',
    data:{labels,datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:{duration:300},
      plugins:{
        legend:{display:false},
        tooltip:{
          mode:'index',
          intersect:false,
          backgroundColor:'rgba(15,17,22,.95)',
          padding:14,
          titleFont:{size:13,weight:'700',family:"'DM Sans',sans-serif"},
          bodyFont:{size:11,family:"'DM Sans',sans-serif"},
          borderColor:'rgba(255,255,255,.08)',
          borderWidth:1,
          callbacks:{
            title:items=>{
              const total=items.reduce((a,it)=>a+it.raw,0);
              const fmt=v=>v>=1000000?(v/1000000).toFixed(2)+'M AED':v>=1000?(v/1000).toFixed(0)+'K AED':v.toLocaleString()+' AED';
              return items[0].label+' — '+fmt(total);
            },
            beforeBody:()=>[''],
            label:item=>{
              const v=item.raw;
              if(v<1000)return null;
              const total=item.chart.data.datasets.reduce((a,ds)=>a+ds.data[item.dataIndex],0);
              const pct=(v/total*100).toFixed(1);
              const fmt=v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'K':v.toLocaleString();
              // Pad category name to align values
              const name=item.dataset.label;
              return `  ${name}: ${fmt} AED  (${pct}%)`;
            },
            labelColor:item=>({backgroundColor:item.dataset.backgroundColor,borderColor:'transparent',borderWidth:0,borderRadius:3}),
            afterBody:()=>[''],
            footer:items=>{
              // Sort items by value desc for the footer summary
              const sorted=[...items].sort((a,b)=>b.raw-a.raw).slice(0,3);
              return ['Top 3: '+sorted.map(i=>i.dataset.label.split(' ')[0]).join(', ')];
            }
          }
        }
      },
      scales:{
        y:{
          stacked:true,
          beginAtZero:true,
          grid:{color:'#f0f1f3'},
          ticks:{
            font:{size:10,family:'JetBrains Mono'},
            callback:v=>v>=1000000?(v/1000000).toFixed(0)+'M':v>=1000?(v/1000).toFixed(0)+'K':v
          }
        },
        x:{
          stacked:true,
          grid:{display:false},
          ticks:{font:{size:ovGran==='daily'?8:10},maxRotation:ovGran==='daily'?45:0,maxTicksLimit:maxTicks}
        }
      },
      onClick:(e,el)=>{if(el.length){go('month',barMonths[el[0].index]);}}
    }
  });
}

  const activeSubs=getActiveSubs('cxSubPills');

  if(selCat){

  } else {
    // Show all categories
    const f=cats.filter(c=>c.s>=ms&&c.s<=xs&&c.t>=mt&&c.t<=xt).sort((a,b)=>{
      const va=cxSort==='n'?a.n:a[cxSort];const vb=cxSort==='n'?b.n:b[cxSort];

  <span class="fl">Nudge Fit</span><div class="vtabs"><button class="vtab active" onclick="setInsFilter('nudge','all',this)">All</button><button class="vtab" onclick="setInsFilter('nudge','high',this)">🔥 High</button><button class="vtab" onclick="setInsFilter('nudge','medium',this)">⚡ Med</button><button class="vtab" onclick="setInsFilter('nudge','low',this)">Low</button></div>
</div>
<div class="ct">
  <div class="kr" style="grid-template-columns:repeat(6,1fr);margin-bottom:20px">
    <div class="kp"><div class="kl">Total Insights</div><div class="kv">${insights.length}</div></div>
    <div class="kp"><div class="kl">Auto-Detected</div><div class="kv" style="color:var(--orange)">${insights.filter(i=>i.type==='auto').length}</div></div>
    <div class="kp"><div class="kl">Internal</div><div class="kv" style="color:var(--purple)">${insights.filter(i=>i.action==='internal').length}</div></div>
    <div class="kp"><div class="kl">Cross-Sell</div><div class="kv" style="color:#14b8a6">${xsIns.length}</div></div>
    <div class="kp"><div class="kl">Revenue Potential</div><div class="kv" style="color:var(--ad)">${fmtN(xsRev)}<small>AED/mo</small></div></div>
    <div class="kp"><div class="kl">Nudges Ready</div><div class="kv" style="color:var(--blue)">${insights.filter(i=>i.action==='nudge').length}</div></div>
  </div>
  <div id="insContent"></div>
</div>`}

function renderInsights(){
  const f=insights.filter(i=>{
    if(insFilter.action!=='all'&&i.action!==insFilter.action)return false;
    if(insFilter.source!=='all'&&i.type!==insFilter.source)return false;
    if(insFilter.nudge!=='all'&&i.nudge!==insFilter.nudge)return false;
    return true;
  });
  const nudgeIns=f.filter(i=>i.action==='nudge');
  const intIns=f.filter(i=>i.action==='internal');
  const xsIns=f.filter(i=>i.action==='crosssell');
  const nudgeColor=n=>n==='high'?'background:var(--al);color:var(--ad)':n==='medium'?'background:var(--orangel);color:#b45309':'background:var(--bg);color:var(--t3)';
  const nudgeIcon=n=>n==='high'?'🔥':n==='medium'?'⚡':'○';
  const chgHtml=c=>c>0?`<span style="color:var(--ad);font-weight:700">▲+${c}%</span>`:`<span style="color:var(--red);font-weight:700">▼${c}%</span>`;
  const cardItems=[{k:'vi',l:'VI',c:'#1e3a5f'},{k:'vs',l:'VS',c:'#2563eb'},{k:'vp',l:'VP',c:'#60a5fa'},{k:'mt',l:'MT',c:'#f59e0b'},{k:'mp',l:'MP',c:'#fbbf24'},{k:'db',l:'DB',c:'#94a3b8'}];
  const miniBar=cards=>{if(!cards)return '';return `<div style="display:flex;height:6px;border-radius:3px;overflow:hidden;width:100%">${cardItems.map(i=>`<div style="width:${cards[i.k]}%;background:${i.c}" title="${i.l}: ${cards[i.k]}%"></div>`).join('')}</div>`};

  const insRow=(ins)=>{
    const prod=ins.pid?prods.find(p=>p.id===ins.pid):null;
    const sugProd=!prod&&ins.fl.cats?prods.find(p=>p.mc.some(m=>ins.fl.cats?.includes(m))):null;
    return `<tr style="cursor:pointer" onclick="toggleInsDetail(${ins.id})">
      <td style="text-align:left"><div style="font-weight:600;font-size:12.5px">${ins.nm}</div><div style="display:flex;gap:4px;margin-top:3px">${ins.type==='auto'?'<span style="font-size:8px;font-weight:700;padding:1px 5px;border-radius:6px;background:var(--orangel);color:#b45309">AUTO</span>':''}<span style="font-size:8px;font-weight:700;padding:1px 5px;border-radius:6px;${nudgeColor(ins.nudge)}">${nudgeIcon(ins.nudge)} ${ins.nudge.toUpperCase()}</span>${ins.seasonal?'<span style="font-size:8px;font-weight:700;padding:1px 5px;border-radius:6px;background:var(--purplel);color:var(--purple)">📅 SEASONAL</span>':''}</div></td>
      <td>${fmtN(ins.cu)}</td>
      <td>${chgHtml(ins.chg)}</td>
      <td><div style="width:80px">${miniBar(ins.cards)}</div></td>
      <td>${prod?`<span style="font-size:11px">${prod.ic} ${prod.n.split(' ').slice(0,3).join(' ')}</span>`:sugProd?`<span style="font-size:11px;color:var(--orange)">💡 ${sugProd.n.split(' ').slice(0,3).join(' ')}</span>`:'<span style="color:var(--t3);font-size:11px">—</span>'}</td>
      <td style="text-align:left"><div style="height:30px;width:80px"><canvas id="chit-${ins.id}"></canvas></div></td>
      <td style="text-align:center">${ins.action==='nudge'?`<button class="btn btn-p btn-sm" onclick="event.stopPropagation();openNudgeComposer(${ins.id})">📱 Push</button>`:'<button class="btn btn-g btn-sm" onclick="event.stopPropagation()">View</button>'}</td>
    </tr>
    <tr id="idr-${ins.id}" style="display:none"><td colspan="${ins.action==='crosssell'?'8':'7'}" style="padding:0;background:var(--bg);text-align:left">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--bd)">
        <!-- Left: Condition Summary -->
        <div style="padding:16px;border-right:1px solid var(--bd)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">${ins.action==='crosssell'?'Rule Definition':'Condition Summary'}</div>
            <button class="btn btn-g btn-sm" onclick="event.stopPropagation();go('builder')" style="font-size:10px">✏️ Edit Filters</button>
          </div>
          <div style="display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:12px">
            ${ins.action==='crosssell'&&ins.fl.rule?`
              ${ins.fl.rule.cat?`<div style="color:var(--t3);font-weight:600">Category</div><div>${ins.fl.rule.cat}</div>`:''}
              ${ins.fl.rule.sub?`<div style="color:var(--t3);font-weight:600">Subcategory</div><div>${ins.fl.rule.sub}</div>`:''}
              <div style="color:var(--t3);font-weight:600">Condition</div><div>${ins.fl.rule.cond==='no_product'?'No matching product':ins.fl.rule.cond==='debit_only'?'Debit card only':ins.fl.rule.cond==='no_category'?'No txns in '+ins.fl.rule.tgtCat:ins.fl.rule.cond}</div>
              ${ins.fl.rule.minMonths?`<div style="color:var(--t3);font-weight:600">Min Active</div><div>${ins.fl.rule.minMonths} months</div>`:''}
              ${ins.fl.rule.prodType?`<div style="color:var(--t3);font-weight:600">Product Gap</div><div>${ins.fl.rule.prodType}</div>`:''}
            `:`
              <div style="color:var(--t3);font-weight:600">Target</div><div>${ins.fl.tgt==='brand'?'Brand':'Category'}</div>
              ${ins.fl.cats?`<div style="color:var(--t3);font-weight:600">Categories</div><div>${ins.fl.cats.join(', ')}</div>`:''}
              ${ins.fl.br?`<div style="color:var(--t3);font-weight:600">Brands</div><div>${ins.fl.br.join(', ')}</div>`:''}
              ${ins.fl.ms?`<div style="color:var(--t3);font-weight:600">Min Spend</div><div>${ins.fl.ms.toLocaleString()} AED</div>`:''}
              ${ins.fl.xs?`<div style="color:var(--t3);font-weight:600">Max Spend</div><div>${ins.fl.xs.toLocaleString()} AED</div>`:''}
              ${ins.fl.mf?`<div style="color:var(--t3);font-weight:600">Min Frequency</div><div>${ins.fl.mf}+ transactions</div>`:''}
            `}
            <div style="color:var(--t3);font-weight:600">Timeframe</div><div>Last ${ins.mo} month${ins.mo>1?'s':''}</div>
            <div style="color:var(--t3);font-weight:600">Customers</div><div style="font-weight:700;color:var(--ad)">${fmtN(ins.cu)}</div>
            <div style="color:var(--t3);font-weight:600">Change</div><div>${ins.chg>=0?`<span style="color:var(--ad)">▲ +${ins.chg}%</span>`:`<span style="color:var(--red)">▼ ${ins.chg}%</span>`}</div>
            <div style="color:var(--t3);font-weight:600">Source</div><div>${ins.type==='auto'?'🤖 Auto-detected':ins.type==='rule'?'⚙️ Default rule':'📌 Saved'}</div>
            ${ins.action==='crosssell'?`
              <div style="color:var(--t3);font-weight:600">Revenue/mo</div><div style="font-weight:700;color:var(--ad)">${fmtN(ins.rev||0)} AED</div>
              <div style="color:var(--t3);font-weight:600">Conversion</div><div style="font-weight:700">${ins.conv||0}%</div>
              <div style="color:var(--t3);font-weight:600">Status</div><div><span style="font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;${ins.xstatus==='active'?'background:#d1fae5;color:#065f46':'background:#fef3c7;color:#92400e'}">${ins.xstatus||'active'}</span></div>
            `:`<div style="color:var(--t3);font-weight:600">Action</div><div>${ins.action==='nudge'?'📱 Customer nudge':'🏦 Internal action'}</div>`}
            ${ins.seasonal?`<div style="color:var(--t3);font-weight:600">Seasonal</div><div>📅 ${ins.seasonal}</div>`:''}
          </div>
          ${ins.reason?`<div style="margin-top:12px;padding:10px 12px;background:var(--sf);border-radius:8px;border:1px solid var(--bd)"><div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;margin-bottom:4px">${ins.type==='auto'?'AI Reasoning':'Description'}</div><div style="font-size:12px;color:var(--t2);line-height:1.6">${ins.reason}</div></div>`:''}
        </div>
        <!-- Right: Card Mix + Product + Actions -->
        <div style="padding:16px">
          <div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Card Mix</div>
          <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;width:100%;margin-bottom:6px">${ins.cards?cardItems.map(i=>`<div style="width:${ins.cards[i.k]}%;background:${i.c}" title="${i.l}: ${ins.cards[i.k]}%"></div>`).join(''):''}</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">${ins.cards?cardItems.filter(i=>ins.cards[i.k]>0).map(i=>`<span style="font-size:10px;color:var(--t2);display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:${i.c};display:inline-block"></span>${i.l} ${ins.cards[i.k]}%</span>`).join(''):''}</div>

          ${prod?`<div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Attached Product</div>
          <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sf);border-radius:8px;border:1px solid var(--bd);margin-bottom:16px">
            <div style="font-size:18px">${prod.ic}</div>
            <div><div style="font-weight:600;font-size:12px">${prod.n}</div><div style="font-size:10px;color:var(--t3)">${prod.d.substring(0,60)}...</div></div>
          </div>`:sugProd?`<div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Suggested Product</div>
          <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fef3c7;border-radius:8px;border:1px solid #fbbf24;margin-bottom:16px">
            <div style="font-size:18px">${sugProd.ic}</div>
            <div><div style="font-weight:600;font-size:12px;color:#92400e">💡 ${sugProd.n}</div><div style="font-size:10px;color:#92400e">${sugProd.d.substring(0,60)}...</div></div>
          </div>`:''}

          <div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Actions</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-g btn-sm" onclick="event.stopPropagation()">📋 Customer IDs</button>
            <button class="btn btn-g btn-sm" onclick="event.stopPropagation()">📊 Export CSV</button>
            ${ins.action==='crosssell'?`
              <button class="btn btn-p btn-sm" onclick="event.stopPropagation();openNudgeComposer(${ins.id})">📱 Create Nudge</button>
              ${ins.xstatus==='active'?'<button class="btn btn-g btn-sm" onclick="event.stopPropagation()">⏸ Pause</button>':'<button class="btn btn-g btn-sm" onclick="event.stopPropagation()">▶ Activate</button>'}
            `:ins.action==='nudge'?`
              <button class="btn btn-p btn-sm" onclick="event.stopPropagation();openNudgeComposer(${ins.id})">📱 Create Nudge</button>
              ${!prod?`<button class="btn btn-g btn-sm" onclick="event.stopPropagation();openAttachProduct(${ins.id})">🔗 Attach Product</button>`:''}
              <button class="btn btn-sm" style="background:linear-gradient(135deg,#dbeafe,#ede9fe);border:1px solid #93c5fd;color:#1e40af;font-weight:600" onclick="event.stopPropagation();convertToXsell(${ins.id})">💰 Convert to Cross-Sell →</button>
            `:`
              <button class="btn btn-b btn-sm" onclick="event.stopPropagation()">🏦 Create Action</button>
              ${!prod?`<button class="btn btn-g btn-sm" onclick="event.stopPropagation();openAttachProduct(${ins.id})">🔗 Attach Product</button>`:''}
              <button class="btn btn-sm" style="background:linear-gradient(135deg,#dbeafe,#ede9fe);border:1px solid #93c5fd;color:#1e40af;font-weight:600" onclick="event.stopPropagation();convertToXsell(${ins.id})">💰 Convert to Cross-Sell →</button>
            `}
          </div>
        </div>
      </div>
    </td></tr>`;
  };

  const buildTable=(title,icon,items,emptyMsg,isXsell)=>{
    if(insFilter.action!=='all'&&((title.includes('Nudge')&&insFilter.action!=='nudge')||(title.includes('Internal')&&insFilter.action!=='internal')||(title.includes('Cross-Sell')&&insFilter.action!=='crosssell')))return '';
    const headers=isXsell
      ?'<th style="text-align:left">Opportunity</th><th>Status</th><th>Customers</th><th>Revenue/mo</th><th>Conv.</th><th>Product</th><th style="text-align:left">Trend</th><th style="text-align:center">Action</th>'
      :'<th style="text-align:left">Insight</th><th>Customers</th><th>Change</th><th>Card Mix</th><th>Product</th><th style="text-align:left">Trend</th><th style="text-align:center">Action</th>';
    return `<div style="margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="font-size:15px;font-weight:700">${icon} ${title}</span><span class="badge ${title.includes('Nudge')?'bb2':title.includes('Cross')?'bg2':'bg2'}" style="font-size:10px">${items.length}</span>
      ${isXsell?`<span style="font-size:11px;color:var(--t3);margin-left:auto">${fmtN(items.filter(i=>i.xstatus==='active').reduce((a,x)=>a+(x.rev||0),0))} AED/mo potential</span>`:''}</div>
      ${items.length?`<div class="tc"><table>
        <thead><tr>${headers}</tr></thead>
        <tbody>${items.map(i=>isXsell?xsRow(i):insRow(i)).join('')}</tbody>
      </table></div>`:`<div style="padding:20px;text-align:center;color:var(--t3);font-size:13px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r)">${emptyMsg}</div>`}
    </div>`;
  };

  // Cross-sell row renderer
  const xsRow=(ins)=>{
    const prod=ins.pid?prods.find(p=>p.id===ins.pid):null;
    const sugProd=!prod&&ins.fl.cats?prods.find(p=>p.mc.some(m=>ins.fl.cats?.includes(m))):null;
    return `<tr style="cursor:pointer;${ins.xstatus==='paused'?'opacity:.55':''}" onclick="toggleInsDetail(${ins.id})">
      <td style="text-align:left"><div style="font-weight:600;font-size:12.5px">${ins.nm}</div><div style="display:flex;gap:4px;margin-top:3px"><span style="font-size:8px;font-weight:700;padding:1px 5px;border-radius:6px;${ins.type==='rule'?'background:#d1fae5;color:#065f46':'background:var(--purplel);color:var(--purple)'}">${ins.type==='rule'?'⚙️ RULE':'📌 CUSTOM'}</span><span style="font-size:8px;font-weight:700;padding:1px 5px;border-radius:6px;${nudgeColor(ins.nudge)}">${nudgeIcon(ins.nudge)} ${ins.nudge.toUpperCase()}</span></div></td>
      <td><span style="font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;${ins.xstatus==='active'?'background:#d1fae5;color:#065f46':'background:#fef3c7;color:#92400e'}">${ins.xstatus||'active'}</span></td>
      <td style="font-family:var(--m);font-weight:600">${fmtN(ins.cu)}</td>
      <td style="font-family:var(--m);font-weight:600;color:var(--ad)">${fmtN(ins.rev||0)}</td>
      <td style="font-family:var(--m);font-weight:600">${ins.conv||0}%</td>
      <td>${prod?`<span style="font-size:11px">${prod.ic} ${prod.n.split(' ').slice(0,3).join(' ')}</span>`:'<span style="color:var(--t3);font-size:11px">—</span>'}</td>
      <td style="text-align:left"><div style="height:30px;width:80px"><canvas id="chit-${ins.id}"></canvas></div></td>
      <td style="text-align:center"><button class="btn btn-p btn-sm" onclick="event.stopPropagation();openNudgeComposer(${ins.id})">📱 Push</button></td>
    </tr>` + insRow(ins).split('</tr>').filter(s=>s.includes('idr-')).map(s=>s+'</tr>').join('');
  };

  const el=document.getElementById('insContent');
  if(!el)return;
  el.innerHTML=buildTable('Internal Insights — Discovery','🏦',intIns,'No internal insights match current filters',false)
    +buildTable('Cross-Sell Opportunities — Revenue','💰',xsIns,'No cross-sell opportunities match current filters',true)
    +buildTable('Customer Nudges — Ready to Push','📱',nudgeIns,'No customer nudge insights match current filters',false);
  setTimeout(()=>{
    f.forEach(ins=>{
      const cv=document.getElementById('chit-'+ins.id);if(!cv)return;
      new Chart(cv,{type:'line',data:{labels:ins.tr.map((_,i)=>''),datasets:[{data:ins.tr,borderColor:ins.chg>=0?'#10b981':'#ef4444',backgroundColor:'transparent',tension:.3,pointRadius:0,borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{y:{display:false},x:{display:false}}}});
    });
  },50);
}

function toggleInsDetail(id){const r=document.getElementById('idr-'+id);if(r)r.style.display=r.style.display==='none'?'table-row':'none'}

function convertToXsell(insId){
  const ins=insights.find(i=>i.id===insId);if(!ins)return;
  // Convert insight to cross-sell type
  ins.action='crosssell';
  ins.rev=Math.floor(ins.cu*40); // estimate ~40 AED/customer/mo
  ins.conv=10.0;
  ins.xstatus='active';
  ins.mo=12;
  ins.fl.rule={cat:ins.fl.cats?.[0]||null,sub:null,cond:'insight_derived'};
  // Pad trend to 12 months if needed
  if(ins.tr.length<12){const base=ins.tr;while(ins.tr.length<12)ins.tr.unshift(Math.floor(base[0]*(.85+Math.random()*.15)))}
  renderInsights();
  setTimeout(()=>{const r=document.getElementById('idr-'+insId);if(r)r.style.display='table-row'},100);
}

// ===== PAGE: BUILDER =====
function pgBuilder(){return `
<div class="bc"><a onclick="go('overview')">Dashboard</a><span class="sep">/</span><a onclick="go('insights')">Insights</a><span class="sep">/</span>New Insight</div>

    <div id="ibct" style="display:none">

      <select class="fi" style="width:200px;margin-bottom:10px" id="ibCatSel" onchange="showSubPills(this.value,'ibSubPills');calcIB()"><option value="">Select category</option>${taxonomy.map(t=>`<option value="${t.n}">${t.n}</option>`).join('')}</select>
      <div id="ibSubPills" class="subpills" style="display:none;padding:6px 0 4px;border-bottom:none"></div>
      <div style="font-size:12px;font-weight:600;color:var(--t2);margin:10px 0 6px">Or select multiple categories</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${taxonomy.map(t=>`<label class="cl"><input type="checkbox" class="ibc" value="${t.n}" style="accent-color:var(--ac)" onchange="calcIB()"> ${t.n}</label>`).join('')}</div>
    </div>

function togIBT(){const v=document.getElementById('ibt').value;document.getElementById('ibbr').style.display=v==='brand'?'block':'none';document.getElementById('ibct').style.display=v==='category'?'block':'none'}

function calcIB(){
  const tgt=document.getElementById('ibt').value;
  const ms=document.getElementById('ibms').value;
  const mf=document.getElementById('ibmf').value;
  const g=document.querySelector('input[name="ibg"]:checked')?.value||'';
  const nats=[...document.querySelectorAll('.ibn:checked')].length;
  const hasF=tgt||ms||mf||g||nats;
  if(!hasF){document.getElementById('ibcnt').textContent='—';document.getElementById('ibsub').textContent='Set filters above';return}
  let base=229400;
  if(tgt==='brand'){const c=[...document.querySelectorAll('.ibb:checked')].length;if(c)base=Math.floor(base*c*.08)}
  if(tgt==='category'){
    const catSel=document.getElementById('ibCatSel')?.value;
    const multiCats=[...document.querySelectorAll('.ibc:checked')].length;
    const activeSubs=getActiveSubs('ibSubPills');
    if(catSel){
      base=Math.floor(base*.12);
      if(activeSubs&&activeSubs.length>0){base=Math.floor(base*activeSubs.length*.25)}
    } else if(multiCats){
      base=Math.floor(base*multiCats*.12);
    }
  }
  if(ms)base=Math.floor(base*Math.max(.1,1-(parseInt(ms)/5000)));
  if(mf&&parseInt(mf)>5)base=Math.floor(base*.4);
  if(g)base=Math.floor(base*.52);
  if(nats)base=Math.floor(base*nats*.15);
  base=Math.max(8,base);
  const mo=parseInt(document.querySelector('input[name="ibm"]:checked')?.value||'6');
  document.getElementById('ibcnt').textContent=base.toLocaleString();
  document.getElementById('ibsub').textContent=`Transacted in last ${mo} month${mo>1?'s':''}`;
  const labels=[],data=[];const now=new Date();
  for(let i=mo-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);labels.push(d.toLocaleString('en',{month:'short',year:'2-digit'}));data.push(Math.floor(base*(.85+Math.random()*.3)))}
  if(charts.ib)charts.ib.destroy();
  charts.ib=new Chart(document.getElementById('chib'),{type:'line',data:{labels,datasets:[{data,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.08)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:'#10b981',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#f0f1f3'},ticks:{font:{size:10,family:'JetBrains Mono'}}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
}

function saveIns(){
  const cnt=document.getElementById('ibcnt').textContent;
  if(cnt==='—')return alert('Set filters first');
  const nm=prompt('Name this insight:','New Insight');if(!nm)return;
  const pid=document.getElementById('ibprod').value;
  const mo=parseInt(document.querySelector('input[name="ibm"]:checked')?.value||'6');
  const c=parseInt(cnt.replace(/,/g,''));
  insights.push({id:Date.now(),nm,mo,cu:c,tr:Array.from({length:mo},()=>Math.floor(c*(.85+Math.random()*.3))),fl:{tgt:document.getElementById('ibt').value},pid:pid?parseInt(pid):null,al:null});
  document.getElementById('ins-badge').textContent=insights.length;
  go('insights');
}

let walletDim='cat',walletMetric='spend';

function setWM(m,el){walletMetric=m;el.parentElement.querySelectorAll('.vtab').forEach(t=>t.classList.remove('active'));el.classList.add('active');buildWallet()}
function buildWallet(){
  const ctx=document.getElementById('ch2');if(!ctx)return;
  if(charts.c2)charts.c2.destroy();
  let labels,data,colors,metricLabel;
  if(walletDim==='cat'){
    const sorted=[...cats].sort((a,b)=>{const k=walletMetric==='spend'?'s':walletMetric==='frequency'?'t':'c';return b[k]-a[k]});
    labels=sorted.map(c=>c.n);colors=sorted.map(c=>c.cl);
    if(walletMetric==='spend'){data=sorted.map(c=>c.s);metricLabel='AED'}
    else if(walletMetric==='frequency'){data=sorted.map(c=>c.t);metricLabel='txns'}
    else{data=sorted.map(c=>c.c);metricLabel='customers'}
  } else {
    const sorted=[...brands].sort((a,b)=>{const k=walletMetric==='spend'?'s':walletMetric==='frequency'?'t':'c';return b[k]-a[k]}).slice(0,10);
    labels=sorted.map(b=>b.n);colors=sorted.map(b=>b.cl);
    if(walletMetric==='spend'){data=sorted.map(b=>b.s);metricLabel='AED'}
    else if(walletMetric==='frequency'){data=sorted.map(b=>b.t);metricLabel='txns'}
    else{data=sorted.map(b=>b.c);metricLabel='customers'}
  }
  charts.c2=new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},padding:8,boxWidth:12}},tooltip:{callbacks:{label:ctx2=>{const t=ctx2.dataset.data.reduce((a,b)=>a+b,0);return ` ${ctx2.label}: ${(ctx2.raw/t*100).toFixed(1)}% (${ctx2.raw.toLocaleString()} ${metricLabel})`}}}},cutout:'60%',onClick:(e,el)=>{if(el.length){if(walletDim==='cat')go('cat-detail',el[0].index);else go('brand-detail',brands.indexOf(brands.filter(b=>b.n===labels[el[0].index])[0]))}}}});
}

      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;cursor:pointer;transition:all .15s" onclick="attachProd(${insId},${p.id})" onmouseover="this.style.borderColor='var(--ac)'" onmouseout="this.style.borderColor='var(--bd)'">
        <div style="width:36px;height:36px;border-radius:10px;background:${p.bg};display:flex;align-items:center;justify-content:center;font-size:18px">${p.ic}</div>

function filterAttachProds(q,insId){
  const el=document.getElementById('attachProdList');if(!el)return;
  const ins=insights.find(i=>i.id===insId);
  const matchCats=ins?.fl?.cats||[];
  const lq=q.toLowerCase();
  const filtered=prods.filter(p=>p.n.toLowerCase().includes(lq)||p.d.toLowerCase().includes(lq)||p.tags.some(t=>t.toLowerCase().includes(lq)));
  el.innerHTML=`<div style="display:flex;flex-direction:column;gap:6px">${filtered.map(p=>{
    const isMatch=p.mc.some(m=>matchCats.includes(m));
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:${isMatch?'var(--al)':'var(--sf)'};border:1px solid ${isMatch?'var(--ad)30':'var(--bd)'};border-radius:10px;cursor:pointer;transition:all .15s" onclick="attachProd(${insId},${p.id})" onmouseover="this.style.borderColor='var(--ac)'" onmouseout="this.style.borderColor='${isMatch?'var(--ad)30':'var(--bd)'}'" >
      <div style="width:36px;height:36px;border-radius:10px;background:${p.bg};display:flex;align-items:center;justify-content:center;font-size:18px">${p.ic}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:13px">${p.n}</div><div style="font-size:10px;color:var(--t3);margin-top:1px">${p.d.substring(0,70)}...</div></div>
      ${isMatch?'<div style="font-size:10px;font-weight:700;color:var(--ad);white-space:nowrap">⭐ Match</div>':''}
    </div>`}).join('')}</div>`;
}

function attachProd(insId,prodId){
  const ins=insights.find(i=>i.id===insId);if(!ins)return;
  ins.pid=prodId;
  closeModal();
  renderInsights();
}

function updateNudgePreview(){
  const t=document.getElementById('ndgTitle');
  const b=document.getElementById('ndgBody');
  const c=document.getElementById('ndgCta');
  if(t)document.getElementById('ndgPrevTitle').textContent=t.value;
  if(b)document.getElementById('ndgPrevBody').textContent=b.value;
  if(c)document.getElementById('ndgPrevCta').textContent=c.value;
  if(t)document.getElementById('ndgTitleLen').textContent=t.value.length;
  if(b)document.getElementById('ndgBodyLen').textContent=b.value.length;
}

// Version switcher
(async()=>{
  const sel=document.getElementById('vswitch');if(!sel)return;
  const thisFile=location.pathname.split('/').pop()||'analytics-v1.html';
  try{
    const r=await fetch('versions.json?t='+Date.now());
    const versions=await r.json();
    if(versions.length<=1){sel.style.display='none';return}
    sel.innerHTML=versions.map(v=>`<option value="${v.file}"${v.file===thisFile?' selected':''}>${v.version}</option>`).join('');
  }catch(e){sel.style.display='none'}
})();
