<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Lune Analytics</title>
<script>
(async()=>{
  try{
    const r=await fetch('versions.json?t='+Date.now());
    const v=await r.json();
    const hash=location.hash.replace('#','');
    const match=v.find(x=>x.version===hash);
    location.replace(match?match.file:v[v.length-1].file);
  }catch(e){location.replace('analytics-v1.html')}
})();
</script>
</head><body></body></html>
